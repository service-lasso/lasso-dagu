# Safe Dagu workflow example for Service Lasso Secrets Broker refs.
# This file intentionally contains ref identifiers only; no secret values.

name: service-lasso-secretref-example
description: Resolve scoped runtime config through Service Lasso and @secretsbroker.

x-service-lasso:
  daguOptional: true
  secrets:
    - name: DATABASE_URL
      ref: services/api/runtime/DATABASE_URL
      target: env
      required: true
      purpose: dagu-run
    - name: STRIPE_API_TOKEN
      ref: services/billing/runtime/STRIPE_API_TOKEN
      target: env
      required: false
      purpose: dagu-run
  audit:
    workflowId: service-lasso-secretref-example
    runIdFrom: dagu
    brokerRequestPrefix: sb-dagu

steps:
  - name: print-safe-status
    command: node
    args:
      - -e
      - >-
        console.log(JSON.stringify({
          workflow: process.env.DAGU_WORKFLOW_NAME,
          secretRefsResolved: ["services/api/runtime/DATABASE_URL"],
          secretValues: "<redacted-by-service-lasso>",
          outcome: "ready"
        }))
    env:
      SERVICE_LASSO_SECRETREF_MODE: broker-resolved
